name: Build TOTV+ TV APK

on:
  workflow_dispatch:   # يدوي فقط — لا بناء تلقائي (اسأل قبل البناء)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # احفظ Manifest التلفاز قبل توليد السكافولد
      - name: Backup TV manifest
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.tv.xml
          fi

      # ولّد ملفات منصّة أندرويد المفقودة (لا يلمس lib/ ولا pubspec.yaml)
      - name: Generate Android scaffolding
        run: flutter create . --org com.totvplus --project-name totvplus --platforms=android

      # أعد Manifest التلفاز (leanback + cleartext http)
      - name: Restore TV manifest
        run: |
          if [ -f /tmp/AndroidManifest.tv.xml ]; then
            cp /tmp/AndroidManifest.tv.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Get packages
        run: flutter pub get

      # توقيع ثابت حتى يقبل الجهاز التحديث فوق النسخة القديمة
      # (أسرار المستودع: TV_KEYSTORE_B64 · TV_KEY_PASS) — بدونها يُستخدم توقيع التطوير
      - name: Signing
        env:
          KS: ${{ secrets.TV_KEYSTORE_B64 }}
          PW: ${{ secrets.TV_KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/tv.jks
            printf 'storeFile=tv.jks\nstorePassword=%s\nkeyAlias=tv\nkeyPassword=%s\n' "$PW" "$PW" > android/key.properties
            G=android/app/build.gradle.kts
            python3 - "$G" <<'PY'
          import sys,re
          p=sys.argv[1];s=open(p).read()
          s=s.replace('android {','''val kp = java.util.Properties().apply { val f = rootProject.file("key.properties"); if (f.exists()) load(f.inputStream()) }
          android {
              signingConfigs { create("rel") { storeFile = file(kp["storeFile"] as String); storePassword = kp["storePassword"] as String; keyAlias = kp["keyAlias"] as String; keyPassword = kp["keyPassword"] as String } }''',1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rel")')
          open(p,'w').write(s)
          PY
          fi

      - name: Build release APK (arm only — أخف)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/totvplus-tv-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/totvplus-tv-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: totvplus-tv-apk
          path: out/*.apk
          if-no-files-found: error
